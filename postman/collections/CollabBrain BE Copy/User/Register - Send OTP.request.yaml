$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "Test@12345",
      "fullName": "{{name}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 or 409 or 422', function () {
        pm.expect([201, 409, 422, 429]).to.include(pm.response.code);
      });

      pm.test('Response is JSON', function () {
        pm.response.to.be.json;
      });
    language: text/javascript
order: 1000

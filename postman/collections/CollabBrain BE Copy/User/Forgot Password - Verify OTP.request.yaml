$kind: http-request
url: "{{baseUrl}}/user/forgot-password/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "otp": "{{otp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response is JSON', function () {
        pm.response.to.be.json;
      });
    language: text/javascript
order: 6000

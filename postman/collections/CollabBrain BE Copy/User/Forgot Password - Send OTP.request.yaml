$kind: http-request
url: "{{baseUrl}}/user/forgot-password/forgot"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 or 400', function () {
        pm.expect([200, 400]).to.include(pm.response.code);
      });
    language: text/javascript
order: 5000

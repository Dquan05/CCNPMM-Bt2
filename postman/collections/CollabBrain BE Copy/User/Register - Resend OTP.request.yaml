$kind: http-request
url: "{{baseUrl}}/api/auth/resend-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 or 404 or 409 or 429', function () {
        pm.expect([200, 404, 409, 429]).to.include(pm.response.code);
      });

      pm.test('Response is JSON', function () {
        pm.response.to.be.json;
      });
    language: text/javascript
order: 3000
